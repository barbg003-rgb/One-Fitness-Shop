<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Window</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <img id="shop-logo" class="shop-logo" alt="" hidden />
    <h1 id="shop-name">My Shop</h1>
    <p id="tagline">Browse what I'm selling right now</p>
  </header>

  <main id="product-grid" class="product-grid">
    <p id="loading">Loading products…</p>
  </main>

  <footer class="site-footer">
    <p>Made with a shop window page</p>
  </footer>

  <div id="order-backdrop" class="order-backdrop" hidden>
    <div class="order-modal" role="dialog" aria-modal="true" aria-labelledby="order-modal-title">
      <button type="button" id="order-close" class="order-close" aria-label="Close">&times;</button>
      <h2 id="order-modal-title">Order this item</h2>
      <p class="order-product-name" id="order-product-name"></p>

      <form id="order-form">
        <label for="order-name">Your name</label>
        <input type="text" id="order-name" required placeholder="e.g. Alex Smith" />

        <label for="order-quantity">Quantity</label>
        <input type="number" id="order-quantity" min="1" value="1" required />

        <label for="order-notes">Notes (size, colour, delivery preference…)</label>
        <textarea id="order-notes" rows="3" placeholder="Optional"></textarea>

        <button type="submit" class="contact-button order-submit">Send order via WhatsApp</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
